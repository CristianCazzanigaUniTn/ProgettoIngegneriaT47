<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea Post</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <!-- Font Awesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    }
   
    .popup-container {
      position: fixed;
      top: 50%;
      left: 55%;
      transform: translate(-50%, -50%);
      background-color: white;
      max-width: 600px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 2, 0, 12);
      max-width: 800px;
      width: 90%;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .popup-header h2 {
      font-size: 1.8rem;
      color: #007acc;
      flex: 1;
      text-align: center;
    }

    .popup-header .close-button {
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    .form-group {
      display: flex;
      width: 100%;
      margin-bottom: 20px;
    }

    .form-group .image-upload {
      width: 400px;
      height: 400px;
      border: 2px dashed #007acc;
      border-radius: 10px;
      text-align: center;
      padding: 20px;
      margin-right: 20px;
      /* Margine a destra per distanziare dalla descrizione */
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e8f8f5;
      cursor: pointer;
      position: relative;
      /* Posizione relativa per l'anteprima dell'immagine */
    }

    .form-group .image-upload input[type="file"] {
      position: absolute;
      /* Posizione assoluta per coprire tutta l'area */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      /* Rende invisibile l'input */
    }

    .image-preview {
      display: none;
      margin-top: 10px;
    }

    .image-preview img {
      width: 400px;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
    }

    .description-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      /* Per occupare lo spazio rimanente */
    }

    .form-group label {
      font-weight: 700;
      margin-bottom: 5px;
      display: block;
      color: #333;
    }

    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
      margin-bottom: 10px;
      resize: none;
      height: 240px;
      /* Altezza fissa per la textbox */
    }

    textarea:focus {
      border-color: #1abc9c;
      /* Verde acqua */
      outline: none;
    }

    .fixed-location,
    .fixed-time {
      margin: 10px 0;
      font-size: 1rem;
      color: #666;
      font-weight: 400;
    }

    .submit-button {
      width: 100%;
      padding: 12px;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    .submit-button:hover {
      background-color: #005fa3;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 999;
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="popup-container">
    <div class="popup-header">
      <h2>Crea Post</h2>
      <span class="close-button">&times;</span>
    </div>

    <div class="form-group">
      <div class="image-upload">
        <label id="label" for="postImage"><i class="fas fa-upload"></i> Carica una foto</label>
        <input type="file" id="postImage" name="postImage" accept="image/*" required>
        <div class="image-preview" id="imagePreview">
          <img id="previewImg" src="" alt="Anteprima Immagine">
        </div>
      </div>

      <div class="description-container">
        <div class="fixed-location">
          <strong>Posizione:</strong> <span>46.0667, 11.1167</span>
        </div>
        <div class="fixed-time">
          <strong>Data e Ora:</strong> <span>2 Ottobre 2024, 14:12</span>
        </div>
        <p for="postDescription">2</p>
        <div class="form-group">

          <strong for="postDescription">Descrizione:</strong>

        </div>
        <textarea id="postDescription" name="postDescription" placeholder="Scrivi una descrizione..."
          required></textarea>
      </div>
    </div>

    <button type="submit" class="submit-button">Pubblica</button>
  </div>

  <!-- JavaScript per la gestione dell'immagine e il form -->
  <script>
    const postImageInput = document.getElementById('postImage');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const label = document.getElementById('label');

    postImageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        // Crea un oggetto FileReader per leggere l'immagine
        const reader = new FileReader();
        reader.onload = function (e) {
          label.style.display = 'none';
          previewImg.src = e.target.result;  // Imposta l'anteprima
          imagePreview.style.display = 'block';  // Mostra l'anteprima
          postImageInput.style.display = 'none'; // Nascondi il campo di caricamento
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>

</html>
