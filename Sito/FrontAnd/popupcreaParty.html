<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crea Party</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <!-- Font Awesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <link rel="stylesheet" href="css/creaPartyPopUp.css">
</head>
<body>

  <div class="event-form-container" style="display: flex;">
    <div class="event-form-header">
      <h2>Crea il Tuo Party</h2>
      <p>Divertiti e condividi il tuo evento con amici!</p>
      <span class="close-button">&times;</span>
    </div>
    <form id="createPartyForm">
      <div class="form-group">
        <label for="partyName">Nome Party</label>
        <input type="text" id="partyName" name="partyName" placeholder="Es: Compleanno di Anna" required>
      </div>
      <div class="form-group">
        <label for="partyDate">Data e Ora</label>
        <input type="datetime-local" id="partyDate" name="partyDate" required>
      </div>
      <div class="form-group">
        <label for="partyLocation">Luogo</label>
        <input type="text" id="partyLocation" name="partyLocation" placeholder="Es: Casa di Marco" required>
      </div>
      <div class="form-group">
        <label for="partyType">Tipologia</label>
        <select id="partyType" name="partyType" required>
          <option value="" disabled selected>Scegli una tipologia</option>
          <option value="compleanno">Compleanno</option>
          <option value="festa">Festa Privata</option>
          <option value="barbecue">Barbecue</option>
          <option value="picnic">Picnic</option>
        </select>
      </div>
      <div class="form-group">
        <label for="partyParticipants">Numero Massimo di Partecipanti</label>
        <input type="number" id="partyParticipants" name="partyParticipants" placeholder="Es: 50" min="1" required>
      </div>
      <div class="form-group full-width">
        <label for="partyDescription">Descrizione</label>
        <textarea id="partyDescription" name="partyDescription" placeholder="Descrivi il tuo party..." required></textarea>
      </div>
      <div class="form-group full-width">
        <label class="image-label">Immagine Party</label>
        <div class="image-upload">
          <label for="partyImage"><i class="fas fa-upload"></i> Carica Immagine</label>
          <input type="file" id="partyImage" name="partyImage" accept="image/*" required>
        </div>
        <div class="image-preview" id="imagePreviews">
          <img src="" alt="Anteprima Immagine" id="previewImgs">
          <button type="button" class="remove-image" id="removeImage"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <button type="submit" class="submit-button">Crea Party</button>
    </form>
  </div>

  <script>
    const partyImageInput = document.getElementById('partyImage');
    const imagePreviews = document.getElementById('imagePreviews');
    const previewImgs = document.getElementById('previewImgs');
    const removeImageButton = document.getElementById('removeImage');

    partyImageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImgs.src = e.target.result;
          imagePreviews.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    });

    removeImageButton.addEventListener('click', function () {
      partyImageInput.value = '';
      previewImgs.src = '';
      imagePreviews.style.display = 'none';
    });

    const createPartyForm = document.getElementById('createPartyForm');
    createPartyForm.addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Party creato con successo!');
      createPartyForm.reset();
      imagePreviews.style.display = 'none';
    });
  </script>
</body>
</html>
