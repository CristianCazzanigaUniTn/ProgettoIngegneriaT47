<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/loginpage.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
    <title>Pagina con Sfondo</title>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-left">
            <img src="./image/logo.png" alt="Logo" class="logo">
        </div>
        <div class="navbar-center">
            <a id="home" href="#home">HOME</a>
            <a id="mappa" href="#mappa">MAPPA</a>
            <a id="profilo" href="#profilo">PROFILO</a>
            <a id="chisiamo" href="#chi-siamo">CHI SIAMO</a>
        </div>
        <div class="navbar-right">
            <input type="text" placeholder="Cerca" class="search-bar">
            <img src="./image/imp.png" alt="Impostazioni" class="settings-icon">
        </div>
    </nav>
    <div class="login-box">
        <p class="small-text">IL SOCIAL NETWORK DI CUI HAI BISOGNO</p>
        <h1 class="title">EVENTLY</h1>
        <p class="sub-text">ENTRA e partecipa ad EVENTI</p>

        <form class="login-form">
            <input type="text" placeholder="Email, Username o Telefono" class="input-field">
            <input type="password" placeholder="Password" class="input-field">
            <div class="buttons">
                <button type="button" class="btn access">Accedi</button>
                <button type="button" class="btn register">Registrati</button>
            </div>
        </form>

        <div class="google-login">
            <img src="./image/goog.png" alt="Accedi con Google" class="google-icon">
        </div>
    </div>
</body>

</html>
